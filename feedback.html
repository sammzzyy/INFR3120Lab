<!DOCTYPE html>
<html>
    <head>
        <title>Feedback Form</title>
        <link rel="stylesheet" type="text/css" href="index.css">
    </head>
    <body>
        <div id="wrapper">
            <h1>Feedback ... Stay in touch</h1>
            <form action="mailto:ahmed.sheikh@ontariotechu.net?subject=Feedback on webiste"
            method="post" enctype="text/plain" name="feedback_form">
                <p>
                    <label for="Fname">First Name :</label>
                    <input type="text" id="Fname" size="32" placeholder="Enter your first name" required>
                </p>
                <p>
                    <label for="Lname">Last Name :</label>
                    <input type="text" id="Lname" size="32" placeholder="Enter your last name" required>
                </p>
                <p>
                    <label for="email>">Email :</label>
                    <input type="email" id="email" size="40" placeholder="Enter your email" required>
                </p>
                <p>
                    <label for="comments">Comments</label><br>
                    <textarea name="comments" cols="60" rows="6"></textarea>
                </p>
            <p>
                <input type="checkbox" name="mailist">
                <label for="mailist">Put me on your e-list</label>
            </p>
            <p>
                <label for="where">How did you find us</label>
                <select name="where">
                    <option value="Search engine">Search Engine</option>
                    <option value="Social Media">Social Media</option>
                    <option value="Words of mouth">Words of mouth</option>
                    <option value="other">Other</option>
                </select>
            </p>
            <p>
                <label for="counteries">Where do you live</label>
                <input list="counteries">
                <datalist id="counteries">
                    <option value="Afghanistan"> 
                    <option value="Albania"> 
                    <option value="Algeria">
                    <option value="Andorra"> 
                    <option value="Angola">
                    <option value="Antigua and Barbuda">
                    <option value="Argentina"> 
                    <option value="Armenia"> 
                    <option value="Aruba"> 
                    <option value="Australia"> 
                    <option value="Austria"> 
                    <option value="Azerbaijan">
                </datalist>
            </p>
            <p>
                <label for="radio">Do you like our webpage</label>
                <input type="radio" id="radio" value="Yes">
                <label for="radio">Yes</label>
                <input type="radio" id="radio" value="No">
                <label for="radio">No</label>
            </p>
            <p><label for="DoB">What's your birthday</label>
            <input type="date" name="DoB"></p>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
